[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v

markers =
    # ── Traceability: TC identifiers ─────────────────────────────────────────
    tc_001: TC-001 valid submission with all fields creates a release card
    tc_002: TC-002 valid submission persists entry to localStorage
    tc_003: TC-003 all form fields are empty after valid submission
    tc_004: TC-004 zero inline errors visible after valid submission
    tc_005: TC-005 submitted release visible after full page reload
    tc_006: TC-006 all five empty fields show five simultaneous errors
    tc_007: TC-007 only product empty shows product error only
    tc_008: TC-008 only version empty shows version error only
    tc_009: TC-009 only title empty shows title error only
    tc_010: TC-010 only description empty shows description error only
    tc_011: TC-011 only releaseDate empty shows date error only
    tc_012: TC-012 invalid submit does not write any entry to localStorage
    tc_013: TC-013 product whitespace-only is treated as invalid
    tc_014: TC-014 whitespace-only in any required text field is invalid
    tc_015: TC-015 correcting one field clears only that field's error
    tc_016: TC-016 error reappears when corrected field is cleared again
    tc_017: TC-017 single character per field is a valid submission
    tc_018: TC-018 typing one char clears error reactively without resubmit
    tc_019: TC-019 seed entries are rendered in release list on page load
    tc_020: TC-020 product filter works while validation errors are visible
    tc_021: TC-021 filter returns the newly added release by product name
    tc_022: TC-022 existing entries are unchanged after invalid form submit
    tc_023: TC-023 full flow single field error corrected then valid submit
    tc_024: TC-024 full flow all five errors each corrected then valid submit

    # ── Traceability: TC identifiers — REQ-002 (collision-safe namespaced) ────
    tc_req002_001: TC-001 (REQ-002) valid submission creates release card
    tc_req002_002: TC-002 (REQ-002) entry persisted to localStorage
    tc_req002_003: TC-003 (REQ-002) form fields empty after submission
    tc_req002_004: TC-004 (REQ-002) zero errors visible after valid submit
    tc_req002_005: TC-005 (REQ-002) submitted release visible after reload
    tc_req002_006: TC-006 (REQ-002) breaking checkbox stored as isBreaking:true

    # ── Traceability: requirement ─────────────────────────────────────────────
    req_001: tests covering REQ-001 inline form validation
    req_002: tests covering REQ-002 release form happy path submission

    # ── Story grouping ────────────────────────────────────────────────────────
    story_001: tests generated for the REQ-001 inline validation story
    story_002: tests generated for the REQ-002 happy path story

    # ── Test suite / CI gates ─────────────────────────────────────────────────
    smoke:      fast sanity check — run on every build
    regression: full pre-release regression suite
    e2e:        multi-step end-to-end workflow tests

    # ── Priority ──────────────────────────────────────────────────────────────
    critical: must-pass release gate
    high:     high priority tests
    medium:   medium priority tests

    # ── Test category ─────────────────────────────────────────────────────────
    positive:  happy-path / valid input scenarios
    negative:  invalid input / error path scenarios
    boundary:  edge case and boundary value scenarios

    # ── Test type ─────────────────────────────────────────────────────────────
    ui:         DOM and visual assertions
    functional: business behaviour verification
