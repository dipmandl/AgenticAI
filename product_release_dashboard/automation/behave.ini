[behave]
# Feature file paths (relative to automation/ working directory)
paths = features

# Output format
format = pretty
stdout_capture = false
stderr_capture = false

# Logging
logging_level = INFO
logging_format = %(levelname)s:%(name)s:%(message)s

# Exclude manual-only scenarios from automated runs
tags = ~@manual_only

# Strict mode — fail on undefined steps
strict = false
